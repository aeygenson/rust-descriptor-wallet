[workspace]
members = [
    "crates/wallet_core",
    "crates/wallet_sync",
    "crates/wallet_storage",
    "crates/wallet_api",
    "apps/wallet_cli",
    "apps/wallet_desktop/src-tauri",
    "crates/test_support",
]
resolver = "2"
[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Alex Eygenson"]
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
bdk_wallet = { version = "2.3.0", features = ["file_store"] }
bdk_esplora = { version = "0.22.1", features = ["blocking"] }
bdk_file_store = "0.21"
bdk_chain = "0.23.3"
bitcoin = "0.32"
clap = { version = "4", features = ["derive"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls", "json"] }
httpmock = "0.8"
once_cell = "1"
serial_test = "3"
tempfile = "3"
bitcoincore-rpc = "0.19"
bdk_electrum = "0.23"
# Local workspace crates
wallet_core = { path = "crates/wallet_core" }
wallet_sync = { path = "crates/wallet_sync" }
wallet_storage = { path = "crates/wallet_storage" }
wallet_api = { path = "crates/wallet_api" }
test_support = { path = "crates/test_support" }

# Desktop / Tauri
tauri = "2.10.3"
tauri-plugin-log = "2"
tauri-build = "2.5.6"